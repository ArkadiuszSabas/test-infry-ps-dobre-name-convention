[project]
name = "docmind-worker"
version = "0.1.0"
description = "DocMind.ai asynchronous worker service."
requires-python = ">=3.14"
dependencies = [
    "docmind-backend-runtime",
    "docmind-connectors",
    "docmind-core",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv.sources]
docmind-backend-runtime = { workspace = true }
docmind-connectors = { workspace = true }
docmind-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docmind_worker"]
