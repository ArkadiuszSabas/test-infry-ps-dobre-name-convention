[project]
name = "docmind-api"
version = "0.1.0"
description = "DocMind.ai system-of-record API service."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.30.0",
    "azure-identity>=1.25.0",
    "azure-storage-blob>=12.27.0",
    "docmind-backend-runtime",
    "docmind-connectors",
    "docmind-core",
    "httpx>=0.28.0",
    "pyjwt[crypto]>=2.12.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.40",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv.sources]
docmind-backend-runtime = { workspace = true }
docmind-connectors = { workspace = true }
docmind-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docmind_api"]
