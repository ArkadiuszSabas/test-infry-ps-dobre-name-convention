name: Import Langfuse images to ACR

"on":
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub Environment
        required: true
        type: environment
      force:
        description: Re-import and replace an already existing target tag
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  import:
    environment: ${{ inputs.environment }}
    runs-on: [self-hosted, linux, x64, "${{ inputs.environment }}"]
    concurrency:
      group: proservice-langfuse-images-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      AZURE_BUILD_CLIENT_ID: ${{ vars.AZURE_BUILD_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      FORCE_IMPORT: ${{ inputs.force }}
      TF_ENVIRONMENT: ${{ inputs.environment }}
      TF_REF_PROTECTED: ${{ github.ref_protected }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Validate import configuration
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" == "main" && "$TF_REF_PROTECTED" == "true" ]] || {
            echo "::error::Langfuse images may be imported only from the protected main branch."; exit 1;
          }
          case "$TF_ENVIRONMENT" in
            dev|test|prod) ;;
            *) echo "::error::Unsupported environment: $TF_ENVIRONMENT"; exit 1 ;;
          esac
          for variable_name in ACR_NAME AZURE_BUILD_CLIENT_ID AZURE_SUBSCRIPTION_ID AZURE_TENANT_ID; do
            [[ -n "${!variable_name}" ]] || {
              echo "::error::Missing GitHub Environment variable: ${variable_name}"; exit 1;
            }
          done
          command -v docker >/dev/null || {
            echo "::error::Docker is required on the self-hosted runner."; exit 1;
          }
          docker info >/dev/null || {
            echo "::error::The runner cannot access the Docker daemon."; exit 1;
          }

      - uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_BUILD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Mirror approved Langfuse images through runner
        run: |
          set -euo pipefail

          login_server="$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)"
          [[ -n "$login_server" ]] || {
            echo "::error::Could not resolve the ACR login server."; exit 1;
          }
          az acr login --name "$ACR_NAME"

          mirror_image() {
            local source_image="$1"
            local target_image="$2"
            local target_reference="${login_server}/${target_image}"
            local digest=""

            if az acr repository show --name "$ACR_NAME" --image "$target_image" --query digest --output tsv >/dev/null 2>&1; then
              if [[ "$FORCE_IMPORT" != "true" ]]; then
                echo "Target image already exists; skipping: ${target_image}"
                return
              fi
            fi

            # Docker Hub is contacted by this self-hosted runner, not by the ACR Import service.
            docker pull --platform linux/amd64 "$source_image"
            docker tag "$source_image" "$target_reference"
            docker push "$target_reference"

            digest="$(az acr repository show --name "$ACR_NAME" --image "$target_image" --query digest --output tsv)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::ACR returned an invalid digest for ${target_image}."; exit 1;
            }
            echo "${target_image}@${digest}" | tee -a "$GITHUB_STEP_SUMMARY"
          }

          mirror_image "docker.io/langfuse/langfuse:3.185.0" "langfuse/langfuse:3.185.0"
          mirror_image "docker.io/langfuse/langfuse-worker:3.185.0" "langfuse/worker:3.185.0"
          mirror_image "docker.io/clickhouse/clickhouse-server:25.11" "langfuse/clickhouse:25.11"
          mirror_image "docker.io/library/postgres:16.14-alpine" "langfuse/postgres:16.14-alpine"
          mirror_image "docker.io/valkey/valkey:8.1.8-alpine" "langfuse/valkey:8.1.8-alpine"
