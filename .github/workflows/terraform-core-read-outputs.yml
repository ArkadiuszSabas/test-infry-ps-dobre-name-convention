name: Read Terraform Core outputs

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub Environment containing the Core Terraform backend settings
        required: true
        type: environment

permissions:
  contents: read
  id-token: write

jobs:
  read-outputs:
    environment: ${{ inputs.environment }}
    runs-on: [self-hosted, linux, x64]
    concurrency:
      group: proservice-terraform-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      TF_BACKEND_CONTAINER: ${{ vars.TF_CORE_CONTAINER }}
      TF_BACKEND_RESOURCE_GROUP: ${{ vars.TF_BACKEND_RESOURCE_GROUP }}
      TF_BACKEND_STORAGE_ACCOUNT: ${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}
      TF_ENVIRONMENT: ${{ inputs.environment }}
      TF_IN_AUTOMATION: "true"
    defaults:
      run:
        shell: bash
        working-directory: infra/terraform/core
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Validate backend settings
        run: |
          set -euo pipefail
          case "$TF_ENVIRONMENT" in
            dev|uat|prd) ;;
            *) echo "::error::Unsupported environment: $TF_ENVIRONMENT"; exit 1 ;;
          esac
          for variable_name in TF_BACKEND_RESOURCE_GROUP TF_BACKEND_STORAGE_ACCOUNT TF_BACKEND_CONTAINER; do
            if [[ -z "${!variable_name}" ]]; then
              echo "::error::Missing GitHub Environment variable: ${variable_name}"
              exit 1
            fi
          done

      - uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CORE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize Core state read access
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${TF_BACKEND_RESOURCE_GROUP}"
          -backend-config="storage_account_name=${TF_BACKEND_STORAGE_ACCOUNT}"
          -backend-config="container_name=${TF_BACKEND_CONTAINER}"
          -backend-config="key=${TF_ENVIRONMENT}.core.tfstate"
          -backend-config="use_azuread_auth=true"

      - name: Print network-completion inputs
        run: |
          set -euo pipefail
          terraform output private_endpoint_targets
          terraform output container_apps_environment_default_domain
