name: Deploy Langfuse

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the generated DEV Langfuse plan
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  langfuse:
    environment: dev
    runs-on: [self-hosted, linux, x64]
    concurrency:
      group: proservice-terraform-dev
      cancel-in-progress: false
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      CLICKHOUSE_VERSION: "25.11"
      LANGFUSE_VERSION: "3.185.0"
      POSTGRES_VERSION: "16.14-alpine"
      TF_BACKEND_CONTAINER: ${{ vars.TF_LANGFUSE_CONTAINER }}
      TF_BACKEND_RESOURCE_GROUP: ${{ vars.TF_BACKEND_RESOURCE_GROUP }}
      TF_BACKEND_STORAGE_ACCOUNT: ${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}
      TF_IN_AUTOMATION: "true"
      VALKEY_VERSION: "8.1.8-alpine"
    defaults:
      run:
        shell: bash
        working-directory: infra/terraform/langfuse
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Validate protected DEV deployment source
        env:
          TF_APPLY_REQUESTED: ${{ inputs.apply }}
          TF_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "main" || "$TF_REF_PROTECTED" != "true" ]]; then
            echo "::error::Langfuse may be planned and deployed only from protected main."
            exit 1
          fi
          test -f env/dev.tfvars || {
            echo "::error::Missing env/dev.tfvars"; exit 1;
          }
          for variable_name in ACR_NAME TF_BACKEND_RESOURCE_GROUP TF_BACKEND_STORAGE_ACCOUNT TF_BACKEND_CONTAINER; do
            if [[ -z "${!variable_name}" ]]; then
              echo "::error::Missing GitHub Environment variable: ${variable_name}"
              exit 1
            fi
          done
          if [[ "$TF_APPLY_REQUESTED" != "true" && "$TF_APPLY_REQUESTED" != "false" ]]; then
            echo "::error::Invalid apply input."
            exit 1
          fi
      - uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_LANGFUSE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.0
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - name: Initialize isolated Langfuse state
        run: >-
          terraform init -input=false -lockfile=readonly
          -backend-config="resource_group_name=${TF_BACKEND_RESOURCE_GROUP}"
          -backend-config="storage_account_name=${TF_BACKEND_STORAGE_ACCOUNT}"
          -backend-config="container_name=${TF_BACKEND_CONTAINER}"
          -backend-config="key=dev.langfuse.tfstate"
          -backend-config="use_azuread_auth=true"
      - run: terraform validate
      - name: Plan Langfuse
        env:
          TF_VAR_clickhouse_version: ${{ env.CLICKHOUSE_VERSION }}
          TF_VAR_langfuse_version: ${{ env.LANGFUSE_VERSION }}
          TF_VAR_postgres_version: ${{ env.POSTGRES_VERSION }}
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_valkey_version: ${{ env.VALKEY_VERSION }}
        run: |
          terraform plan -input=false -lock-timeout=5m -var-file=env/dev.tfvars -out=tfplan
          terraform show -json tfplan > tfplan.json
      - name: Validate planned ACR target
        run: |
          planned_acr="$(jq -er '.variables.resource_names.value.container_registry' tfplan.json)"
          if [[ "${planned_acr,,}" != "${ACR_NAME,,}" ]]; then
            echo "::error::ACR_NAME does not match resource_names.container_registry in env/dev.tfvars."
            exit 1
          fi
      - name: Block destructive storage changes
        run: |
          protected_storage='[
            "module.langfuse.azurerm_storage_account.this[0]",
            "module.langfuse.azapi_resource.blob_container[0]",
            "module.langfuse.azurerm_storage_account.clickhouse[0]",
            "module.langfuse.azapi_resource.clickhouse_share[0]",
            "module.langfuse.azapi_resource.postgres_share[0]",
            "module.langfuse.azapi_resource.valkey_share[0]"
          ]'
          blocked="$(jq -r --argjson protected "$protected_storage" '
            [.resource_changes[]? |
              select(.address as $address | $protected | index($address)) |
              select(.change.actions | index("delete")) |
              .address] | join(", ")
          ' tfplan.json)"
          if [[ -n "$blocked" ]]; then
            echo "::error::The Langfuse plan would delete or replace protected storage: $blocked"
            exit 1
          fi
      - name: Mirror pinned Langfuse images
        if: inputs.apply
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/langfuse-docker
        run: |
          set -euo pipefail
          login_server="${ACR_NAME}.azurecr.io"
          cleanup_registry() {
            docker logout "$login_server" >/dev/null 2>&1 || true
            rm -rf "$DOCKER_CONFIG"
          }
          trap cleanup_registry EXIT
          mkdir -p "$DOCKER_CONFIG"
          az acr login --name "$ACR_NAME" --only-show-errors

          mirror_image() {
            local source_image="$1"
            local destination_image="$2"
            docker pull "$source_image"
            docker tag "$source_image" "$destination_image"
            docker push "$destination_image"
            docker image inspect "$destination_image" --format 'Mirrored {{index .RepoDigests 0}}'
          }

          mirror_image "langfuse/langfuse:${LANGFUSE_VERSION}" "${login_server}/langfuse/langfuse:${LANGFUSE_VERSION}"
          mirror_image "langfuse/langfuse-worker:${LANGFUSE_VERSION}" "${login_server}/langfuse/worker:${LANGFUSE_VERSION}"
          mirror_image "clickhouse/clickhouse-server:${CLICKHOUSE_VERSION}" "${login_server}/langfuse/clickhouse:${CLICKHOUSE_VERSION}"
          mirror_image "postgres:${POSTGRES_VERSION}" "${login_server}/langfuse/postgres:${POSTGRES_VERSION}"
          mirror_image "valkey/valkey:${VALKEY_VERSION}" "${login_server}/langfuse/valkey:${VALKEY_VERSION}"
      - name: Apply Langfuse with controlled stateful restart
        if: inputs.apply
        env:
          TF_VAR_clickhouse_version: ${{ env.CLICKHOUSE_VERSION }}
          TF_VAR_langfuse_version: ${{ env.LANGFUSE_VERSION }}
          TF_VAR_postgres_version: ${{ env.POSTGRES_VERSION }}
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_valkey_version: ${{ env.VALKEY_VERSION }}
        run: |
          set -Eeuo pipefail
          resource_group="$(jq -r '.variables.application_resource_group_name.value' tfplan.json)"
          previous_revisions="$(mktemp)"

          wait_stopped() {
            local app_name="$1" revision_name="$2" deadline=$((SECONDS + 300))
            while (( SECONDS < deadline )); do
              active="$(az containerapp revision show --name "$app_name" --resource-group "$resource_group" --revision "$revision_name" --query properties.active -o tsv --only-show-errors)"
              active="${active,,}"
              replicas="$(az containerapp replica list --name "$app_name" --resource-group "$resource_group" --revision "$revision_name" --query 'length(@)' -o tsv --only-show-errors)"
              [[ "$active" == "false" && "$replicas" == "0" ]] && return 0
              sleep 5
            done
            echo "::error::Timed out stopping $app_name revision $revision_name"
            return 1
          }

          wait_ready() {
            local app_name="$1" deadline=$((SECONDS + 300))
            while (( SECONDS < deadline )); do
              revision_name="$(az containerapp show --name "$app_name" --resource-group "$resource_group" --query properties.latestRevisionName -o tsv --only-show-errors)"
              if [[ -n "$revision_name" ]]; then
                revision_json="$(az containerapp revision show --name "$app_name" --resource-group "$resource_group" --revision "$revision_name" -o json --only-show-errors)"
                replicas_json="$(az containerapp replica list --name "$app_name" --resource-group "$resource_group" --revision "$revision_name" -o json --only-show-errors)"
                if ! jq -e '.properties.active == true' <<<"$revision_json" >/dev/null; then
                  activate_revision "$app_name" "$revision_name"
                  sleep 5
                  continue
                fi
                if jq -e '.properties.active == true and (.properties.runningState | startswith("Running")) and .properties.healthState == "Healthy"' <<<"$revision_json" >/dev/null &&
                  jq -e 'length > 0 and all(.[]; all(.properties.containers[]; .ready == true and .started == true))' <<<"$replicas_json" >/dev/null; then
                  return 0
                fi
              fi
              sleep 5
            done
            echo "::error::Timed out waiting for $app_name to become healthy"
            return 1
          }

          activate_revision() {
            local app_name="$1" revision_name="$2" activation_output
            if ! activation_output="$(az containerapp revision activate --name "$app_name" --resource-group "$resource_group" --revision "$revision_name" --only-show-errors 2>&1)"; then
              if [[ "$activation_output" != *RevisionAlreadyInRequestedState* ]]; then
                echo "::error::Failed to activate $app_name revision $revision_name: $activation_output"
                return 1
              fi
            fi
          }

          restore_previous() {
            while IFS='|' read -r app_name revision_name; do
              [[ -n "$app_name" && -n "$revision_name" ]] || continue
              activate_revision "$app_name" "$revision_name" || true
            done < "$previous_revisions"
          }
          trap 'restore_previous; rm -f "$previous_revisions"' ERR

          jq -r '
            [.resource_changes[]? |
              select(.address == "module.langfuse.azapi_resource.clickhouse[0]" or
                     .address == "module.langfuse.azurerm_container_app.postgres[0]" or
                     .address == "module.langfuse.azurerm_container_app.valkey[0]") |
              select((.change.actions | index("update")) or (.change.actions | index("delete"))) |
              .change.before.name] | .[]
          ' tfplan.json | while IFS= read -r app_name; do
            [[ -n "$app_name" && "$app_name" != "null" ]] || continue
            while IFS= read -r revision_name; do
              [[ -n "$revision_name" ]] || continue
              printf '%s|%s\n' "$app_name" "$revision_name" >> "$previous_revisions"
              az containerapp revision deactivate --name "$app_name" --resource-group "$resource_group" --revision "$revision_name" --only-show-errors
              wait_stopped "$app_name" "$revision_name"
            done < <(az containerapp revision list --name "$app_name" --resource-group "$resource_group" --query '[?properties.active].name' -o tsv --only-show-errors)
          done

          terraform apply -input=false -lock-timeout=5m tfplan
          terraform output -json container_app_names | jq -r '.[]' | while IFS= read -r app_name; do
            wait_ready "$app_name"
          done
          trap - ERR
          rm -f "$previous_revisions"
      - name: Remove local sensitive plan
        if: always()
        run: rm -f tfplan tfplan.json
