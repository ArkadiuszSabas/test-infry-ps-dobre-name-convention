name: Bootstrap Langfuse Key Vault Secrets

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub Environment (test or prod)
        required: true
        type: environment

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    environment: ${{ inputs.environment }}
    runs-on: [self-hosted, linux, x64, "${{ inputs.environment }}"]
    concurrency:
      group: proservice-langfuse-secrets-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
      AZURE_CORE_CLIENT_ID: ${{ vars.AZURE_CORE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      REF_PROTECTED: ${{ github.ref_protected }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate bootstrap configuration
        run: |
          set -euo pipefail

          case "$DEPLOYMENT_ENVIRONMENT" in
            test) LANGFUSE_KEY_VAULT_NAME="ee7c45kvocrapptest01" ;;
            prod) LANGFUSE_KEY_VAULT_NAME="ee7c45kvocrappprod01" ;;
            *) echo "::error::This workflow supports only test and prod."; exit 1 ;;
          esac

          [[ "$REF_PROTECTED" == "true" ]] || {
            echo "::error::Secret bootstrap is allowed only from a protected ref."; exit 1;
          }

          for variable_name in AZURE_CORE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            [[ -n "${!variable_name}" ]] || {
              echo "::error::Missing GitHub Environment variable: ${variable_name}"; exit 1;
            }
          done

      - uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CORE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Generate, store, and verify Langfuse secrets
        run: |
          set -euo pipefail
          set +x

          case "$DEPLOYMENT_ENVIRONMENT" in
            test) key_vault_name="ee7c45kvocrapptest01" ;;
            prod) key_vault_name="ee7c45kvocrappprod01" ;;
            *) echo "::error::Unsupported environment."; exit 1 ;;
          esac

          secret_names=(
            "langfuse-clickhouse-password"
            "langfuse-postgres-password"
            "langfuse-valkey-password"
            "langfuse-encryption-key"
            "langfuse-salt"
            "langfuse-nextauth-secret"
            "langfuse-init-public-key"
            "langfuse-init-secret-key"
          )

          existing_secrets=()
          for secret_name in "${secret_names[@]}"; do
            if az keyvault secret show \
              --vault-name "$key_vault_name" \
              --name "$secret_name" \
              --query id \
              --output tsv >/dev/null 2>&1; then
              existing_secrets+=("$secret_name")
            fi
          done

          if (( ${#existing_secrets[@]} > 0 )); then
            echo "::error::Refusing to overwrite existing Langfuse secrets in $key_vault_name: ${existing_secrets[*]}"
            exit 1
          fi

          put_secret() {
            local secret_name="$1"
            local secret_value="$2"

            az keyvault secret set \
              --vault-name "$key_vault_name" \
              --name "$secret_name" \
              --value "$secret_value" \
              --only-show-errors \
              --output none
          }

          put_secret "langfuse-clickhouse-password" "$(openssl rand -hex 16)"
          put_secret "langfuse-postgres-password" "$(openssl rand -hex 16)"
          put_secret "langfuse-valkey-password" "$(openssl rand -hex 16)"
          put_secret "langfuse-encryption-key" "$(openssl rand -hex 32)"
          put_secret "langfuse-salt" "$(openssl rand -base64 32)"
          put_secret "langfuse-nextauth-secret" "$(openssl rand -base64 32)"
          put_secret "langfuse-init-public-key" "lf_pk_$(openssl rand -hex 24)"
          put_secret "langfuse-init-secret-key" "lf_sk_$(openssl rand -hex 32)"

          verify_hex() {
            local secret_name="$1"
            local secret_value="$2"
            local expected_length="$3"
            [[ "${#secret_value}" -eq "$expected_length" && "$secret_value" =~ ^[0-9a-f]+$ ]] || {
              echo "::error::Secret $secret_name has an invalid format."; exit 1;
            }
          }

          verify_base64_32_bytes() {
            local secret_name="$1"
            local secret_value="$2"
            [[ "$secret_value" =~ ^[A-Za-z0-9+/]{43}=$ ]] || {
              echo "::error::Secret $secret_name has an invalid Base64 format."; exit 1;
            }
          }

          verify_prefixed_hex() {
            local secret_name="$1"
            local secret_value="$2"
            local pattern="$3"
            [[ "$secret_value" =~ $pattern ]] || {
              echo "::error::Secret $secret_name has an invalid format."; exit 1;
            }
          }

          printf '%-38s %-10s %s\n' "Secret" "Status" "Length"
          for secret_name in "${secret_names[@]}"; do
            secret_value="$(az keyvault secret show \
              --vault-name "$key_vault_name" \
              --name "$secret_name" \
              --query value \
              --output tsv)"

            case "$secret_name" in
              langfuse-init-public-key)
                verify_prefixed_hex "$secret_name" "$secret_value" '^lf_pk_[0-9a-f]{48}$'
                ;;
              langfuse-init-secret-key)
                verify_prefixed_hex "$secret_name" "$secret_value" '^lf_sk_[0-9a-f]{64}$'
                ;;
              langfuse-salt|langfuse-nextauth-secret)
                verify_base64_32_bytes "$secret_name" "$secret_value"
                ;;
              langfuse-clickhouse-password|langfuse-postgres-password|langfuse-valkey-password)
                verify_hex "$secret_name" "$secret_value" 32
                ;;
              langfuse-encryption-key)
                verify_hex "$secret_name" "$secret_value" 64
                ;;
            esac

            printf '%-38s %-10s %s\n' "$secret_name" "present" "${#secret_value}"
          done
