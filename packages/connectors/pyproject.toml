[project]
name = "docmind-connectors"
version = "0.1.0"
description = "Optional DocMind.ai connector modules and connector tooling."
requires-python = ">=3.14"
dependencies = [
    "docmind-backend-runtime",
    "docmind-core",
    "docmind-integrations",
    "fastapi>=0.124.0",
    "httpx>=0.28.0",
    "pypdf>=6.14.2",
]

[project.scripts]
docmind-source-package = "docmind_connectors.tools.source_package:main"

[tool.uv.sources]
docmind-backend-runtime = { workspace = true }
docmind-core = { workspace = true }
docmind-integrations = { workspace = true }

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docmind_connectors"]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "hatch_build.py",
    "pyproject.toml",
    "src/**",
    "*/src/**",
]
