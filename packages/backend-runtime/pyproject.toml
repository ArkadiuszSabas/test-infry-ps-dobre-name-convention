[project]
name = "docmind-backend-runtime"
version = "0.1.0"
description = "Shared FastAPI runtime helpers for DocMind.ai backend services."
requires-python = ">=3.14"
dependencies = [
    "azure-monitor-opentelemetry>=1.8.7",
    "fastapi>=0.124.0",
    "httpx>=0.28.0",
    "opentelemetry-instrumentation-fastapi>=0.61b0",
    "python-dotenv>=1.2.2",
    "starlette<1.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docmind_backend_runtime"]
